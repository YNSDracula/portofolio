<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YMotor Service</title>
<style>
:root{
  --bg:#1a0b0b;          
  --card:#2b0f0f;        
  --accent:#ff4c4c;      
  --accent-2:#cc0000;    
  --glass: rgba(255,76,76,0.1);
  --text:#fdf0f0;        
}

/* Reset */
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:"Poppins",sans-serif;
  background: radial-gradient(circle at top,var(--bg),#120606 80%);
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:40px 20px;
}

.wrap{
  width:800px;
  max-width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  align-items: start; /* kiri & kanan tinggi sesuai konten */
}


/* Header */
header{
  grid-column: 1 / -1;
  text-align:center;
  margin-bottom:20px;
}

header h1{
  font-size:28px;
  color:var(--accent);
  text-shadow:0 0 6px var(--accent),0 0 12px var(--accent-2);
  transition:0.2s;
}

header h1:hover{
  text-shadow:0 0 12px var(--accent),0 0 24px var(--accent-2);
}

/* Card */
.card{
  background:linear-gradient(180deg,var(--card),#1e0a0a);
  border-radius:16px;
  padding:22px;
  box-shadow:0 0 15px rgba(255,76,76,0.25);
  margin-bottom:20px;
  transition:0.3s;
}

.card:hover{
  box-shadow:0 0 25px rgba(255,76,76,0.5);
}

/* Form & Keterangan */
form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

label{
  display:block;
  font-size:14px;
  margin-top:6px;
  color:var(--text);
}

input, textarea{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid rgba(255,76,76,0.25);
  background:#2b0f0f;
  color:var(--text);
  font-size:14px;
  outline:none;
  box-shadow:0 0 6px rgba(255,76,76,0.15) inset;
  transition:0.2s;
}

input:hover, textarea:hover, input:focus, textarea:focus{
  border-color:var(--accent-2);
  box-shadow:0 0 12px rgba(255,76,76,0.35) inset;
}

/* Keterangan penggunaan */
#instructions{
  background:var(--glass);
  border:1px solid rgba(255,76,76,0.2);
  border-radius:12px;
  padding:16px;
  box-shadow:0 0 12px rgba(255,76,76,0.25);
  font-size:14px;
  color:var(--text);
}

/* Buttons */
button{
  margin-top:16px;
  width:100%;
  padding:12px;
  border-radius:14px;
  border:none;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  color:black;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 0 12px rgba(255,76,76,0.35),0 8px 25px rgba(255,76,76,0.25);
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px rgba(255,76,76,0.6),0 10px 30px rgba(255,76,76,0.4);
}

/* Ringkasan */
#summary{
  grid-column: 1 / -1;
  background:rgba(255,76,76,0.05);
  border:1px solid rgba(255,76,76,0.25);
  border-radius:12px;
  padding:14px;
  margin-top:16px;
  font-size:14px;
  color:var(--text);
  box-shadow:0 0 10px rgba(255,76,76,0.25);
  transition:0.3s;
}

#summary:hover{
  box-shadow:0 0 20px rgba(255,76,76,0.5);
}

/* Footer */
footer{
  grid-column: 1 / -1;
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:var(--text);
  opacity:0.7;
}

/* Responsive */
@media(max-width:900px){
  .wrap{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>YMotor Service</h1>
  </header>

  <!-- Form Isian -->
  <div class="card">
    <form id="serviceForm">
      <label for="name">Nama</label>
      <input type="text" id="name" placeholder="Nama Anda">

      <label for="phone">Nomor WA</label>
      <input type="text" id="phone" placeholder="628xxxxxxxxx">

      <label for="motor">Jenis Motor</label>
      <input type="text" id="motor" placeholder="Ketik jenis motor Anda">

      <label for="problem">Masalah / Kerusakan</label>
      <textarea id="problem" placeholder="Contoh: Rem berdecit, oli ganti"></textarea>

      <label for="address">Alamat</label>
      <input type="text" id="address" placeholder="Alamat lengkap">

      <label for="date">Tanggal Service</label>
      <input type="date" id="date">

      <label for="notes">Catatan Tambahan</label>
      <textarea id="notes" placeholder="Informasi tambahan (opsional)"></textarea>
    </form>
  </div>

  <!-- Keterangan / Instruksi -->
  <div class="card" id="instructions">
    <div style="background:#2b0f0f; padding:16px; border-radius:12px; 
            border:1px solid rgba(255,76,76,0.2); color:#ffffff;
            font-size:14px; line-height:1.6; max-width:100%;">
  <p>Isi form dengan lengkap.</p>
  <p>Setelah klik <strong>"Lihat Ringkasan"</strong>, ringkasan pesanan akan muncul di bawah.</p>
  <p>Setelah itu, Anda bisa langsung mengirim ke WhatsApp.</p>
</div>

    <button id="generate">Lihat Ringkasan</button>
    <button id="sendWA">Kirim ke WhatsApp</button>
	<footer style="text-align:center; padding:12px; font-size:13px; color:#ffffff;">
  &copy; 2025 YUNUS PABETTENG. All rights reserved.
</footer>

  </div>

  <!-- Ringkasan -->
  <div id="summary" style="display:none"></div>

</div>

<script>
const generateBtn = document.getElementById("generate");
const sendBtn = document.getElementById("sendWA");
const summary = document.getElementById("summary");

generateBtn.addEventListener("click",()=>{
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const motor = document.getElementById("motor").value;
  const problem = document.getElementById("problem").value;
  const address = document.getElementById("address").value;
  const date = document.getElementById("date").value;
  const notes = document.getElementById("notes").value;

  if(!name||!phone||!motor||!problem||!address||!date){
    alert("Harap isi semua field wajib!");
    return;
  }

  summary.style.display="block";
  summary.innerHTML=`
<b>Ringkasan Pesanan:</b><br>
Nama: ${name}<br>
WA: ${phone}<br>
Motor: ${motor}<br>
Masalah: ${problem}<br>
Alamat: ${address}<br>
Tanggal: ${date}<br>
Catatan: ${notes||"-"}
  `;
});

sendBtn.addEventListener("click",()=>{
  const name = encodeURIComponent(document.getElementById("name").value);
  const phone = encodeURIComponent(document.getElementById("phone").value);
  const motor = encodeURIComponent(document.getElementById("motor").value);
  const problem = encodeURIComponent(document.getElementById("problem").value);
  const address = encodeURIComponent(document.getElementById("address").value);
  const date = encodeURIComponent(document.getElementById("date").value);
  const notes = encodeURIComponent(document.getElementById("notes").value);

  if(!name||!phone||!motor||!problem||!address||!date){
    alert("Harap isi semua field wajib!");
    return;
  }

  const waLink = `https://wa.me/${phone}?text=Halo,%20saya%20ingin%20booking%20service%20motor.%20Nama:%20${name},%20Motor:%20${motor},%20Masalah:%20${problem},%20Alamat:%20${address},%20Tanggal:%20${date},%20Catatan:%20${notes}`;
  window.open(waLink,"_blank");
});
</script>
</body>
</html>
